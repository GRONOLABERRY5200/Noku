<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noku</title>
    <link rel="icon" type="image/x-icon" href="coy.png">
    <style>
        /* Reset default browser margins */
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Full-screen cover background image */
        body {
            background-image: url('https://www.image2url.com/r2/default/images/1789949965168-a6e00100-78cf-4154-ad42-d672ede579f5.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Main container that takes up the whole screen */
        .layout-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* The red header */
        .top-header {
            background-color: #ff0000; /* Red */
            color: black;
            border-bottom: 4px solid black;
            padding: 10px 20px;
            flex-shrink: 0;
        }

        /* Style for the Noku text */
        .top-header h1 {
            margin: 0;
            font-size: 3rem;
            font-weight: normal;
        }

        /* The large content area at the bottom */
        .main-content {
            flex-grow: 1;
            background-color: transparent;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            padding: 60px 40px;
            box-sizing: border-box;
        }

        .section-heading {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-weight: normal;
            font-size: 2rem;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .section-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* =========================
           GAMES GRID (2x2)
           ========================= */

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 40px;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 10;
        }

        .game-box {
            display: block;
            width: 100%;
            height: 100%;
            border: 5px solid black;
            box-sizing: border-box;
            background-color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }

        .game-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .game-box:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .games-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                gap: 20px;
            }
            .game-box {
                aspect-ratio: 16 / 9;
            }
        }

        /* =========================
           IMAGE LINK GRID (3 columns)
           ========================= */

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 265px);
            gap: 24px 40px;
        }

        .cube {
            display: block;
            width: 265px;
            height: 220px;
            border: 5px solid #000;
            box-sizing: border-box;
            overflow: hidden;
            background: #999999;
        }

        .cube img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cube:hover {
            opacity: 0.8;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, 265px);
            }
        }

        @media (max-width: 620px) {
            .grid {
                grid-template-columns: 265px;
            }
        }
    </style>
</head>
<body>

    <div class="layout-container">
        <!-- The Header -->
        <header class="top-header">
            <h1>Noku</h1>
        </header>

        <!-- Main content area -->
        <main class="main-content">


            <!-- Image link grid section -->
            <div class="section-block">
                <h2 class="section-heading">Games</h2>
                <div class="grid">

                    <!-- Change href="" to the page you want to open.
                         Change src="" to the image you want displayed. -->

                    <a class="cube" href="page1.html">
                        <img src="image1.jpg" alt="Image 1">
                    </a>

                    <a class="cube" href="page2.html">
                        <img src="image2.jpg" alt="Image 2">
                    </a>

                    <a class="cube" href="page3.html">
                        <img src="image3.jpg" alt="Image 3">
                    </a>

                    <a class="cube" href="page4.html">
                        <img src="image4.jpg" alt="Image 4">
                    </a>

                    <a class="cube" href="page5.html">
                        <img src="image5.jpg" alt="Image 5">
                    </a>

                    <a class="cube" href="page6.html">
                        <img src="image6.jpg" alt="Image 6">
                    </a>

                </div>
            </div>

        </main>
    </div>

</body>
</html>
